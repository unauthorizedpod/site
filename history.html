<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Past Movies</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
        }
        h1, h2, .serif {
            font-family: 'Libre Baskerville', serif;
        }
        .gold-accent {
            color: #C5A059;
        }
        .border-gold {
            border-color: #C5A059;
        }
        .movie-row {
            transition: background-color 0.2s ease;
        }
        .movie-row:hover {
            background-color: #111111;
        }
        #loading-spinner {
            border-top-color: #C5A059;
        }
    </style>
</head>
<body class="text-gray-300 min-h-screen flex flex-col items-center">

    <div class="w-full max-w-3xl mx-auto p-6 md:p-16 flex-grow">

        <header class="text-center mb-16 border-b border-gray-800 pb-12">
            <div class="flex items-center justify-center gap-6 mb-6">
                <i class="fas fa-clapperboard gold-accent text-2xl opacity-50"></i>
                <h1 class="text-4xl md:text-5xl font-bold text-white tracking-tight italic">Past Movies</h1>
                <i class="fas fa-clapperboard gold-accent text-2xl opacity-50"></i>
            </div>
        </header>

        <div id="loading" class="flex justify-center py-20">
            <div class="w-8 h-8 border-2 border-gray-800 border-t-2 rounded-full animate-spin" id="loading-spinner"></div>
        </div>

        <div id="error-state" class="hidden text-center py-20">
            <p class="text-gray-600 serif italic text-sm">Unable to load films.</p>
        </div>

        <div id="movie-list" class="hidden divide-y divide-gray-900">
        </div>

    </div>

    <footer class="w-full max-w-3xl mx-auto px-6 md:px-16 py-12 border-t border-gray-900 flex justify-center gap-12">
        <a href="#" class="text-[10px] uppercase tracking-[0.2em] text-gray-600 hover:text-white transition-colors font-semibold">Submissions</a>
        <a href="#" class="text-[10px] uppercase tracking-[0.2em] text-gray-600 hover:text-white transition-colors font-semibold">Watchlist</a>
    </footer>

    <script>
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyxiSUPnVqt9_cAMOqhFSJtbHa03T0Uch4dy48EY0_DaAx1SHrC7eAPV1U5NpXG7qYVWw/exec';
        const TMDB_API_KEY = '746e663319009236f390938e29383ae0';

        function fetchMovies() {
            return new Promise((resolve) => {
                const callbackName = 'jsonpCb_' + Date.now();
                window[callbackName] = function(data) {
                    delete window[callbackName];
                    const s = document.getElementById('jsonp-script');
                    if (s) s.remove();
                    resolve(data);
                };
                const script = document.createElement('script');
                script.id = 'jsonp-script';
                script.onerror = () => {
                    delete window[callbackName];
                    resolve(null);
                };
                script.src = GOOGLE_SCRIPT_URL + '?callback=' + callbackName;
                document.body.appendChild(script);
            });
        }

        function formatDate(raw) {
            if (!raw) return '';
            const d = new Date(raw);
            if (isNaN(d.getTime())) return raw;
            return d.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
        }

        async function render() {
            const data = await fetchMovies();
            document.getElementById('loading').classList.add('hidden');

            if (!data || !data.movies || data.movies.length === 0) {
                document.getElementById('error-state').classList.remove('hidden');
                return;
            }

            const list = document.getElementById('movie-list');
            list.classList.remove('hidden');

            for (const movie of data.movies) {
                const row = document.createElement('div');
                row.className = 'movie-row flex items-center gap-5 py-4 px-2 rounded';

                let imgSrc = 'https://placehold.co/60x90/111827/4b5563?text=?';

                if (movie.tmdb_id) {
                    try {
                        const r = await fetch(`https://api.themoviedb.org/3/movie/${movie.tmdb_id}?api_key=${TMDB_API_KEY}`);
                        const d = await r.json();
                        if (d.poster_path) {
                            imgSrc = `https://image.tmdb.org/t/p/w185${d.poster_path}`;
                        }
                    } catch { /* keep placeholder */ }
                }

                row.innerHTML = `
                    <img
                        src="${imgSrc}"
                        alt="${movie.title}"
                        class="w-12 h-[72px] object-cover rounded bg-gray-900 flex-shrink-0"
                        onerror="this.src='https://placehold.co/60x90/111827/4b5563?text=?'"
                    >
                    <div class="flex-grow min-w-0">
                        <p class="text-white font-semibold text-sm truncate">${movie.title}</p>
                        <p class="text-gray-600 text-[11px] serif italic mt-0.5">${formatDate(movie.date_watched)}</p>
                    </div>
                `;
                list.appendChild(row);
            }
        }

        render();
    </script>
</body>
</html>
