<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Nights | The Archive</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
        }
        h1, .serif {
            font-family: 'Libre Baskerville', serif;
        }
        .gold-accent {
            color: #C5A059;
        }
        /* Custom loader for the cinematic vibe */
        .loader {
            border: 2px solid #1a1a1a;
            border-top: 2px solid #C5A059;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .movie-card {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #movie-grid::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="text-gray-300 min-h-screen">

    <div class="w-full max-w-6xl mx-auto p-6 md:p-12">
        <header class="text-center mb-16 border-b border-gray-800 pb-12">
            <div class="flex items-center justify-center gap-6 mb-4">
                <i class="fas fa-clapperboard gold-accent text-2xl opacity-50"></i>
                <h1 class="text-4xl md:text-5xl font-bold text-white tracking-tight italic">The Archive</h1>
                <i class="fas fa-clapperboard gold-accent text-2xl opacity-50"></i>
            </div>
            <p class="text-lg text-gray-400 serif italic">All films submitted</p>
        </header>

        <main>
            <div id="loading-state" class="flex flex-col items-center justify-center py-20 space-y-4">
                <div class="loader"></div>
                <p class="text-[10px] uppercase tracking-[0.3em] text-gray-500 font-bold">Retrieving curated titles...</p>
            </div>

            <div id="empty-state" class="hidden text-center py-20">
                <p class="serif italic text-gray-500 text-xl text-balance">The archive is currently awaiting its first entry.</p>
            </div>

            <div id="movie-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-x-4 gap-y-10">
                <!-- Movie items will be injected here -->
            </div>
        </main>

        <footer class="mt-24 pt-12 border-t border-gray-900 text-center">
            <a href="index.html" class="text-[10px] uppercase tracking-[0.4em] text-gray-600 hover:text-white transition-colors">
                ← Back to Submission
            </a>
        </footer>
    </div>

    <script>
        const GET_DATA_URL = 'https://script.google.com/macros/s/AKfycbxrK7ZP53Uxx84VPoCKwmV2yTkr7Np4TbQY1-NjWlrrBwVQCbkkhCZcod0ApK5OGvjo/exec';
        const TMDB_API_KEY = '746e663319009236f390938e29383ae0';

        const movieGrid = document.getElementById('movie-grid');
        const loadingState = document.getElementById('loading-state');
        const emptyState = document.getElementById('empty-state');

        async function loadArchive() {
            try {
                const response = await fetch(GET_DATA_URL);
                const rawList = await response.json(); 

                // Skip the first row (the "Title" header)
                const filmList = rawList && rawList.length > 1 ? rawList.slice(1) : [];

                if (filmList.length === 0) {
                    loadingState.classList.add('hidden');
                    emptyState.classList.remove('hidden');
                    return;
                }

                loadingState.classList.add('hidden');

                for (const entry of filmList) {
                    // Extract ID using Regex: looks for [ID: 12345]
                    const idMatch = entry.match(/\[ID:\s*(\d+)\]/);
                    // Clean title for display: removes the [ID: ...] part
                    const displayTitle = entry.replace(/\s*\[ID:.*\]/, "").trim();
                    
                    let posterPath = null;

                    if (idMatch && idMatch[1]) {
                        // High-accuracy fetch using specific TMDB ID
                        posterPath = await fetchPosterByID(idMatch[1]);
                    } else {
                        // Fallback for Manual Entries (no ID) using search
                        const fallbackData = await fetchMoviePosterBySearch(displayTitle);
                        posterPath = fallbackData ? fallbackData.poster : null;
                    }

                    renderMovie({ title: displayTitle, poster: posterPath });
                }

            } catch (err) {
                console.error("Archive Load Error:", err);
                loadingState.innerHTML = `<p class="text-red-900 text-xs uppercase tracking-widest font-bold">Connection to script failed</p>`;
            }
        }

        async function fetchPosterByID(id) {
            try {
                const url = `https://api.themoviedb.org/3/movie/${id}?api_key=${TMDB_API_KEY}&language=en-US`;
                const response = await fetch(url);
                const data = await response.json();
                return data.poster_path || null;
            } catch (e) {
                return null;
            }
        }

        async function fetchMoviePosterBySearch(title) {
            try {
                const cleanTitle = title.replace(/\s\(\d{4}\)$/, "").trim();
                const url = `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(cleanTitle)}&language=en-US&page=1`;
                const response = await fetch(url);
                const data = await response.json();
                
                if (data.results && data.results.length > 0) {
                    return { poster: data.results[0].poster_path };
                }
                return null;
            } catch (e) {
                return null;
            }
        }

        function renderMovie(movie) {
            const card = document.createElement('div');
            card.className = "group animate-in fade-in slide-in-from-bottom-4 duration-1000";
            
            const posterUrl = movie.poster 
                ? `https://image.tmdb.org/t/p/w342${movie.poster}` 
                : `https://placehold.co/342x513/0a0a0a/333?text=${encodeURIComponent(movie.title)}`;

            card.innerHTML = `
                <div class="aspect-[2/3] w-full rounded-sm overflow-hidden border border-gray-900 group-hover:border-gray-700 transition-all duration-700 bg-gray-900">
                    <img src="${posterUrl}" loading="lazy" 
                         class="w-full h-full object-cover filter grayscale group-hover:grayscale-0 transition-all duration-700 transform group-hover:scale-105"
                         alt="${movie.title}">
                </div>
                <div class="mt-4 px-1">
                    <p class="text-[10px] font-bold text-white leading-tight uppercase tracking-widest truncate group-hover:text-gold transition-colors">${movie.title}</p>
                </div>
            `;
            movieGrid.appendChild(card);
        }

        window.onload = loadArchive;
    </script>
</body>
</html>
